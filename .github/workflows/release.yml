name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT="nodex${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.Version=${VERSION}" -o "${OUTPUT}" ./cmd/nodex

          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "nodex_${{ matrix.os }}_${{ matrix.arch }}.zip" "${OUTPUT}"
            tar -czf "nodex_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "${OUTPUT}"
          else
            tar -czf "nodex_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "${OUTPUT}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}-${{ matrix.arch }}
          path: nodex_*.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum nodex_* > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
